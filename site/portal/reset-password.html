<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password — MHPU</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../assets/favicon-32.png">
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="brand-accent-bar"></div>

<header class="site-header">
  <div class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/mhpu-logo-horizontal.png" alt="Maldives Health Professionals Union" style="height:38px;width:auto;"></a>
  </div>
</header>

<main>
<section style="padding:80px 0;">
  <div class="wrap" style="max-width:420px;">
    <div class="section-title" style="border-bottom:none;padding-bottom:0;margin-bottom:24px;">
      <h2>Set a new password</h2>
    </div>

    <div class="form-alert" id="alert-box" role="status" aria-live="polite"></div>

    <form id="reset-form">
      <div class="field">
        <label for="password">New password <span class="req">*</span></label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="password-confirm">Confirm new password <span class="req">*</span></label>
        <input type="password" id="password-confirm" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-red" style="width:100%;">Set password</button>
    </form>

    <p id="expired-message" style="display:none;font-family:'Source Sans 3',sans-serif;color:var(--muted);font-size:14px;margin-top:20px;">
      This link has expired or already been used. Ask your union office to send a new invite or password reset.
    </p>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="wrap" style="text-align:center;">
    <p style="color:#93918A;font-family:'Source Sans 3',sans-serif;font-size:13px;">&copy; 2026 Maldives Health Professionals Union — Member Portal</p>
  </div>
</footer>

<script src="supabase-client.js"></script>
<script>
  (async function () {
    // Supabase's JS client automatically reads the recovery token out of the
    // URL fragment (#access_token=...&type=recovery) and turns it into a
    // temporary session. We just need to check that session exists.
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      document.getElementById('reset-form').style.display = 'none';
      document.getElementById('expired-message').style.display = 'block';
      return;
    }

    document.getElementById('reset-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const alertBox = document.getElementById('alert-box');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('password-confirm').value;
      const submitBtn = e.target.querySelector('[type="submit"]');

      if (password !== confirm) {
        alertBox.textContent = "Passwords don't match.";
        alertBox.className = 'form-alert error show';
        return;
      }

      submitBtn.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password: password });

      if (error) {
        alertBox.textContent = error.message;
        alertBox.className = 'form-alert error show';
        submitBtn.disabled = false;
        return;
      }

      alertBox.textContent = 'Password set — redirecting to login…';
      alertBox.className = 'form-alert success show';
      setTimeout(function () {
        window.location.href = 'login.html';
      }, 1500);
    });
  })();
</script>
</body>
</html>
