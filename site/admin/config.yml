# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: jazeel5566-design/MHPU-WEBSITE
  branch: main
  identity_url: https://auth.decapbridge.com/sites/ed0ee95a-221d-4340-a01d-5e8f1c6bff0a
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://glistening-alfajores-c84e54.netlify.app

media_folder: "site/assets/uploads"
public_folder: "assets/uploads"

collections:

  # ---------- Hero images (every page) ----------
  - name: "hero-images"
    label: "Hero Images"
    files:
      - name: "hero-images"
        label: "Page Header Photos"
        file: "site/content/hero-images.json"
        description: "Each page's header has a red diagonal stripe by default. Upload a photo here to replace it on that page — leave blank to keep the stripe."
        fields:
          - label: "Homepage (upload one or more — rotates every 30 seconds if more than one)"
            name: "home"
            widget: "list"
            field: { label: "Photo", name: "photo", widget: "image", hint: "Recommended size: at least 2000×1500px, landscape orientation, JPG format, under 1MB. This fills the full screen height, so use a high-resolution photo with the main subject centered." }
          - { label: "About page", name: "about", widget: "image", required: false, hint: "Recommended size: at least 1600×1000px, landscape orientation, JPG format, under 800KB. Fills half of the page banner." }
          - { label: "Membership page", name: "membership", widget: "image", required: false, hint: "Recommended size: at least 1600×1000px, landscape orientation, JPG format, under 800KB. Fills half of the page banner." }
          - { label: "Know Your Rights page", name: "rights", widget: "image", required: false, hint: "Recommended size: at least 1600×1000px, landscape orientation, JPG format, under 800KB. Fills half of the page banner." }
          - { label: "News & Campaigns page", name: "news", widget: "image", required: false, hint: "Recommended size: at least 1600×1000px, landscape orientation, JPG format, under 800KB. Fills half of the page banner." }
          - { label: "Resources page", name: "resources", widget: "image", required: false, hint: "Recommended size: at least 1600×1000px, landscape orientation, JPG format, under 800KB. Fills half of the page banner." }
          - { label: "Contact page", name: "contact", widget: "image", required: false, hint: "Recommended size: at least 1600×1000px, landscape orientation, JPG format, under 800KB. Fills half of the page banner." }

  # ---------- News & campaigns (add / edit only, no reordering) ----------
  - name: "news"
    label: "News & Campaigns"
    files:
      - name: "news"
        label: "News & Campaign Posts"
        file: "site/content/news.json"
        fields:
          - { label: "Page header tag (leave blank to hide it entirely)", name: "heroKicker", widget: "string", required: false }
          - { label: "Page header headline (leave blank to hide it entirely)", name: "heroHeadline", widget: "string", required: false }
          - { label: "Page header text", name: "heroLede", widget: "text", required: false }
          - { label: "Campaign banner tag", name: "campaignTag", widget: "string", required: false }
          - { label: "Campaign headline", name: "campaignHeadline", widget: "string", required: false }
          - { label: "Campaign description", name: "campaignText", widget: "text", required: false }
          - label: "News posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Bargaining", "Campaigns", "Union", "Development"]
              - { label: "Headline", name: "title", widget: "string", required: false }
              - { label: "Date label", name: "date", widget: "string", hint: "e.g. '2 days ago' or '14 March 2026'", required: false }
              - { label: "Hidden (tick to hide this post)", name: "hidden", widget: "boolean", default: false }

  # ---------- Homepage stats ----------
  - name: "stats"
    label: "Homepage Stats"
    files:
      - name: "stats"
        label: "Member Stats"
        file: "site/content/stats.json"
        fields:
          - { label: "Member count", name: "members", widget: "string", required: false }
          - { label: "Member count label", name: "membersLabel", widget: "string", required: false }
          - { label: "Atoll count", name: "atolls", widget: "string", required: false }
          - { label: "Atoll count label", name: "atollsLabel", widget: "string", required: false }
          - { label: "Case resolution rate", name: "resolutionRate", widget: "string", required: false }
          - { label: "Resolution rate label", name: "resolutionRateLabel", widget: "string", required: false }

  # ---------- Leadership & committee ----------
  - name: "leadership"
    label: "Leadership & Committee"
    files:
      - name: "leadership"
        label: "Committee Members"
        file: "site/content/leadership.json"
        fields:
          - label: "Executive committee"
            name: "executive"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Photo (optional — shows initials if left blank)", name: "photo", widget: "image", required: false, hint: "Recommended size: at least 500×500px, square (1:1) crop, JPG or PNG, under 500KB." }
              - { label: "Initials (used if no photo)", name: "initials", widget: "string", required: false }
              - { label: "Full name", name: "name", widget: "string", required: false }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Hidden (tick to hide this person)", name: "hidden", widget: "boolean", default: false }
          - label: "General committee members"
            name: "generalMembers"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Photo (optional — shows initials if left blank)", name: "photo", widget: "image", required: false, hint: "Recommended size: at least 500×500px, square (1:1) crop, JPG or PNG, under 500KB." }
              - { label: "Initials (used if no photo)", name: "initials", widget: "string", required: false }
              - { label: "Full name", name: "name", widget: "string", required: false }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Hidden (tick to hide this person)", name: "hidden", widget: "boolean", default: false }
          - label: "Regional representatives"
            name: "regionalReps"
            widget: "list"
            summary: "{{fields.name}} — {{fields.area}}"
            fields:
              - { label: "Photo (optional — shows initials if left blank)", name: "photo", widget: "image", required: false, hint: "Recommended size: at least 500×500px, square (1:1) crop, JPG or PNG, under 500KB." }
              - { label: "Initials (used if no photo)", name: "initials", widget: "string", required: false }
              - { label: "Full name", name: "name", widget: "string", required: false }
              - { label: "Area covered", name: "area", widget: "string", required: false }
              - { label: "Hidden (tick to hide this person)", name: "hidden", widget: "boolean", default: false }

  # ---------- Resources / downloads ----------
  - name: "resources"
    label: "Resources"
    files:
      - name: "resources"
        label: "Resources Page"
        file: "site/content/resources.json"
        fields:
          - { label: "Page header tag (leave blank to hide it entirely)", name: "heroKicker", widget: "string", required: false }
          - { label: "Page header headline (leave blank to hide it entirely)", name: "heroHeadline", widget: "string", required: false }
          - { label: "Page header text", name: "heroLede", widget: "text", required: false }
          - label: "Member guides"
            name: "guides"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "File type tag", name: "filetag", widget: "string", hint: "e.g. PDF", required: false }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Meta line", name: "meta", widget: "string", hint: "e.g. '4 pages · updated 2026'", required: false }
              - { label: "File", name: "file", widget: "file", hint: "Upload the PDF here. Keep file size under 5MB where possible for faster downloads." }
              - { label: "Hidden (tick to hide this guide)", name: "hidden", widget: "boolean", default: false }
          - label: "Campaign materials"
            name: "campaignMaterials"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "File type tag", name: "filetag", widget: "string", hint: "e.g. PDF, FORM, LINK", required: false }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Meta line", name: "meta", widget: "string", required: false }
              - { label: "Link destination", name: "url", widget: "string", hint: "A file path (upload via the Media Library and paste its path), or a page like contact.html / news.html", required: false }
              - { label: "Is this a file download?", name: "download", widget: "boolean", default: false }
              - { label: "Button text", name: "buttonLabel", widget: "string", hint: "e.g. Download, Open form, View updates", required: false }
              - { label: "Hidden (tick to hide this item)", name: "hidden", widget: "boolean", default: false }
          - { label: "Footer note", name: "footerNote", widget: "text", required: false }

  # ---------- Site-wide (footer, shared across every page) ----------
  - name: "site"
    label: "Site-wide"
    files:
      - name: "site"
        label: "Footer Content"
        file: "site/content/site.json"
        description: "This appears in the footer on every single page."
        fields:
          - { label: "Slogan", name: "footerSlogan", widget: "string", required: false }
          - { label: "Description", name: "footerDescription", widget: "text", required: false }

  # ---------- Page visibility (show/hide each page independently) ----------
  - name: "page-visibility"
    label: "Page Visibility"
    files:
      - name: "page-visibility"
        label: "Show / Hide Pages"
        file: "site/content/page-visibility.json"
        description: "Turn any page off to show a simple \"page unavailable\" message instead of its content — the page itself isn't deleted, and turning the toggle back on restores everything exactly as it was. The header, footer, and navigation stay visible either way, so people can still get to your other pages."
        fields:
          - { label: "Homepage", name: "home", widget: "boolean", default: true }
          - { label: "About page", name: "about", widget: "boolean", default: true }
          - { label: "Membership page", name: "membership", widget: "boolean", default: true }
          - { label: "Know Your Rights page", name: "rights", widget: "boolean", default: true }
          - { label: "News & Campaigns page", name: "news", widget: "boolean", default: true }
          - { label: "Resources page", name: "resources", widget: "boolean", default: true }
          - { label: "Contact page", name: "contact", widget: "boolean", default: true }

  # ---------- About page ----------
  - name: "about-page"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page Content"
        file: "site/content/about.json"
        fields:
          - { label: "Page header tag (leave blank to hide it entirely)", name: "heroKicker", widget: "string", required: false }
          - { label: "Page header headline (leave blank to hide it entirely)", name: "heroHeadline", widget: "string", required: false }
          - { label: "Page header text", name: "heroLede", widget: "text", required: false }
          - { label: "Mission — paragraph 1", name: "missionPara1", widget: "text", required: false }
          - { label: "Mission — paragraph 2", name: "missionPara2", widget: "text", required: false }
          - label: "'What guides us' points"
            name: "guides"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }
          - label: "History timeline"
            name: "history"
            widget: "list"
            summary: "{{fields.year}}"
            fields:
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "Hidden (tick to hide this entry)", name: "hidden", widget: "boolean", default: false }
          - { label: "General members note", name: "generalMembersNote", widget: "text", required: false }
          - { label: "Bottom CTA headline", name: "ctaHeadline", widget: "string", required: false }
          - { label: "Bottom CTA text", name: "ctaText", widget: "text", required: false }

  # ---------- Membership page ----------
  - name: "membership-page"
    label: "Membership Page"
    files:
      - name: "membership"
        label: "Membership Page Content"
        file: "site/content/membership.json"
        fields:
          - { label: "Page header tag (leave blank to hide it entirely)", name: "heroKicker", widget: "string", required: false }
          - { label: "Page header headline (leave blank to hide it entirely)", name: "heroHeadline", widget: "string", required: false }
          - { label: "Page header text", name: "heroLede", widget: "text", required: false }
          - label: "Monthly fee card"
            name: "monthlyFee"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Price", name: "price", widget: "string", required: false }
              - { label: "Period", name: "period", widget: "string", required: false }
              - label: "Features"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }
          - label: "Joining fee card"
            name: "joiningFee"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Price", name: "price", widget: "string", required: false }
              - { label: "Period", name: "period", widget: "string", required: false }
              - label: "Features"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }
          - { label: "Fee note", name: "feeNote", widget: "text", required: false }
          - label: "Ticker banner items"
            name: "ticker"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - { label: "'Apply for membership' subheading", name: "joinSectionSub", widget: "string", required: false }

  # ---------- Know your rights page ----------
  - name: "rights-page"
    label: "Know Your Rights Page"
    files:
      - name: "rights"
        label: "Rights Page Content"
        file: "site/content/rights.json"
        fields:
          - { label: "Page header tag (leave blank to hide it entirely)", name: "heroKicker", widget: "string", required: false }
          - { label: "Page header headline (leave blank to hide it entirely)", name: "heroHeadline", widget: "string", required: false }
          - { label: "Page header text", name: "heroLede", widget: "text", required: false }
          - label: "Ticker banner items"
            name: "ticker"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - label: "Rights sections (accordion)"
            name: "accordion"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Body text", name: "body", widget: "text", required: false }
              - label: "Bullet points"
                name: "bullets"
                widget: "list"
                field: { label: "Point", name: "point", widget: "string" }
              - { label: "Hidden (tick to hide this section)", name: "hidden", widget: "boolean", default: false }
          - { label: "Bottom CTA headline", name: "ctaHeadline", widget: "string", required: false }
          - { label: "Bottom CTA text", name: "ctaText", widget: "text", required: false }
          - label: "Useful links (sidebar buttons)"
            name: "usefulLinks"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Button text", name: "label", widget: "string", required: false }
              - { label: "Link (full URL, e.g. https://...)", name: "url", widget: "string", required: false }
              - { label: "Hidden (tick to hide this link)", name: "hidden", widget: "boolean", default: false }

  # ---------- Contact page ----------
  - name: "contact-page"
    label: "Contact Page"
    files:
      - name: "contact"
        label: "Contact Page Content"
        file: "site/content/contact.json"
        fields:
          - { label: "Page header tag (leave blank to hide it entirely)", name: "heroKicker", widget: "string", required: false }
          - { label: "Page header headline (leave blank to hide it entirely)", name: "heroHeadline", widget: "string", required: false }
          - { label: "Page header text", name: "heroLede", widget: "text", required: false }
          - label: "Head office"
            name: "headOffice"
            widget: "object"
            fields:
              - { label: "Office name", name: "name", widget: "string", required: false }
              - { label: "Address", name: "address", widget: "text", required: false }
              - { label: "Phone 1", name: "phone1", widget: "string", required: false }
              - { label: "Phone 2", name: "phone2", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Regional offices"
            name: "regionalOffices"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Office name", name: "name", widget: "string", required: false }
              - { label: "Details", name: "details", widget: "text", required: false }
              - { label: "Hidden (tick to hide this office)", name: "hidden", widget: "boolean", default: false }
          - { label: "Regional reps note", name: "repsNote", widget: "text", required: false }

  # ---------- Homepage copy ----------
  - name: "home"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Content"
        file: "site/content/home.json"
        fields:
          - { label: "Hero kicker text (leave blank to hide it entirely)", name: "heroKicker", widget: "string", required: false }
          - { label: "Hero headline (white part) — leave both parts blank to hide the whole headline", name: "heroHeadlinePlain", widget: "string", required: false }
          - { label: "Hero headline (red part) — optional", name: "heroHeadlineRed", widget: "string", required: false }
          - { label: "Slogan", name: "slogan", widget: "string", required: false }
          - { label: "Hero subtext", name: "heroSubtext", widget: "text", required: false }
          - { label: "'Take action' card tag", name: "actionTag", widget: "string", required: false }
          - { label: "'Take action' card headline", name: "actionHeadline", widget: "string", required: false }
          - { label: "'Take action' card text", name: "actionText", widget: "text", required: false }
          - label: "'What we fight for' pillars"
            name: "pillars"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "Hidden (tick to hide this pillar)", name: "hidden", widget: "boolean", default: false }
          - label: "'Why join MHPU' cards"
            name: "whyJoin"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", required: false }
              - { label: "Text", name: "text", widget: "text", required: false }
              - { label: "Hidden (tick to hide this card)", name: "hidden", widget: "boolean", default: false }
