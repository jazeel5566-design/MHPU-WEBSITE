# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: jazeel5566-design/MHPU-WEBSITE
  branch: main
  identity_url: https://auth.decapbridge.com/sites/ed0ee95a-221d-4340-a01d-5e8f1c6bff0a
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://glistening-alfajores-c84e54.netlify.app

media_folder: "site/assets/uploads"
public_folder: "assets/uploads"

collections:

  # ---------- Hero images (every page) ----------
  - name: "hero-images"
    label: "Hero Images"
    files:
      - name: "hero-images"
        label: "Page Header Photos"
        file: "site/content/hero-images.json"
        description: "Each page's header has a red diagonal stripe by default. Upload a photo here to replace it on that page — leave blank to keep the stripe."
        fields:
          - label: "Homepage (upload one or more — rotates every 30 seconds if more than one)"
            name: "home"
            widget: "list"
            field: { label: "Photo", name: "photo", widget: "image" }
          - { label: "About page", name: "about", widget: "image", required: false }
          - { label: "Membership page", name: "membership", widget: "image", required: false }
          - { label: "Know Your Rights page", name: "rights", widget: "image", required: false }
          - { label: "News & Campaigns page", name: "news", widget: "image", required: false }
          - { label: "Resources page", name: "resources", widget: "image", required: false }
          - { label: "Contact page", name: "contact", widget: "image", required: false }

  # ---------- News & campaigns (add / edit only, no reordering) ----------
  - name: "news"
    label: "News & Campaigns"
    files:
      - name: "news"
        label: "News & Campaign Posts"
        file: "site/content/news.json"
        fields:
          - { label: "Campaign banner tag", name: "campaignTag", widget: "string" }
          - { label: "Campaign headline", name: "campaignHeadline", widget: "string" }
          - { label: "Campaign description", name: "campaignText", widget: "text" }
          - label: "News posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.category}} — {{fields.title}}"
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Bargaining", "Campaigns", "Union", "Development"]
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Date label", name: "date", widget: "string", hint: "e.g. '2 days ago' or '14 March 2026'" }

  # ---------- Homepage stats ----------
  - name: "stats"
    label: "Homepage Stats"
    files:
      - name: "stats"
        label: "Member Stats"
        file: "site/content/stats.json"
        fields:
          - { label: "Member count", name: "members", widget: "string" }
          - { label: "Member count label", name: "membersLabel", widget: "string" }
          - { label: "Atoll count", name: "atolls", widget: "string" }
          - { label: "Atoll count label", name: "atollsLabel", widget: "string" }
          - { label: "Case resolution rate", name: "resolutionRate", widget: "string" }
          - { label: "Resolution rate label", name: "resolutionRateLabel", widget: "string" }

  # ---------- Leadership & committee ----------
  - name: "leadership"
    label: "Leadership & Committee"
    files:
      - name: "leadership"
        label: "Committee Members"
        file: "site/content/leadership.json"
        fields:
          - label: "Executive committee"
            name: "executive"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Photo (optional — shows initials if left blank)", name: "photo", widget: "image", required: false }
              - { label: "Initials (used if no photo)", name: "initials", widget: "string" }
              - { label: "Full name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
          - label: "General committee members"
            name: "generalMembers"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Photo (optional — shows initials if left blank)", name: "photo", widget: "image", required: false }
              - { label: "Initials (used if no photo)", name: "initials", widget: "string" }
              - { label: "Full name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
          - label: "Regional representatives"
            name: "regionalReps"
            widget: "list"
            summary: "{{fields.name}} — {{fields.area}}"
            fields:
              - { label: "Photo (optional — shows initials if left blank)", name: "photo", widget: "image", required: false }
              - { label: "Initials (used if no photo)", name: "initials", widget: "string" }
              - { label: "Full name", name: "name", widget: "string" }
              - { label: "Area covered", name: "area", widget: "string" }

  # ---------- Resources / downloads ----------
  - name: "resources"
    label: "Resources"
    files:
      - name: "resources"
        label: "Resources Page"
        file: "site/content/resources.json"
        fields:
          - { label: "Page header tag", name: "heroKicker", widget: "string" }
          - { label: "Page header headline", name: "heroHeadline", widget: "string" }
          - { label: "Page header text", name: "heroLede", widget: "text" }
          - label: "Member guides"
            name: "guides"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "File type tag", name: "filetag", widget: "string", hint: "e.g. PDF" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Meta line", name: "meta", widget: "string", hint: "e.g. '4 pages · updated 2026'" }
              - { label: "File", name: "file", widget: "file", hint: "Upload the PDF here" }
          - label: "Campaign materials"
            name: "campaignMaterials"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "File type tag", name: "filetag", widget: "string", hint: "e.g. PDF, FORM, LINK" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Meta line", name: "meta", widget: "string" }
              - { label: "Link destination", name: "url", widget: "string", hint: "A file path (upload via the Media Library and paste its path), or a page like contact.html / news.html" }
              - { label: "Is this a file download?", name: "download", widget: "boolean", default: false }
              - { label: "Button text", name: "buttonLabel", widget: "string", hint: "e.g. Download, Open form, View updates" }
          - { label: "Footer note", name: "footerNote", widget: "text" }

  # ---------- Site-wide (footer, shared across every page) ----------
  - name: "site"
    label: "Site-wide"
    files:
      - name: "site"
        label: "Footer Content"
        file: "site/content/site.json"
        description: "This appears in the footer on every single page."
        fields:
          - { label: "Slogan", name: "footerSlogan", widget: "string" }
          - { label: "Description", name: "footerDescription", widget: "text" }

  # ---------- About page ----------
  - name: "about-page"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page Content"
        file: "site/content/about.json"
        fields:
          - { label: "Page header tag", name: "heroKicker", widget: "string" }
          - { label: "Page header headline", name: "heroHeadline", widget: "string" }
          - { label: "Page header text", name: "heroLede", widget: "text" }
          - { label: "Mission — paragraph 1", name: "missionPara1", widget: "text" }
          - { label: "Mission — paragraph 2", name: "missionPara2", widget: "text" }
          - label: "'What guides us' points"
            name: "guides"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }
          - label: "History timeline"
            name: "history"
            widget: "list"
            summary: "{{fields.year}}"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "General members note", name: "generalMembersNote", widget: "text" }
          - { label: "Bottom CTA headline", name: "ctaHeadline", widget: "string" }
          - { label: "Bottom CTA text", name: "ctaText", widget: "text" }

  # ---------- Membership page ----------
  - name: "membership-page"
    label: "Membership Page"
    files:
      - name: "membership"
        label: "Membership Page Content"
        file: "site/content/membership.json"
        fields:
          - { label: "Page header tag", name: "heroKicker", widget: "string" }
          - { label: "Page header headline", name: "heroHeadline", widget: "string" }
          - { label: "Page header text", name: "heroLede", widget: "text" }
          - label: "Monthly fee card"
            name: "monthlyFee"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - label: "Features"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }
          - label: "Joining fee card"
            name: "joiningFee"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Period", name: "period", widget: "string" }
              - label: "Features"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }
          - { label: "Fee note", name: "feeNote", widget: "text" }
          - label: "Ticker banner items"
            name: "ticker"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - { label: "'Apply for membership' subheading", name: "joinSectionSub", widget: "string" }

  # ---------- Know your rights page ----------
  - name: "rights-page"
    label: "Know Your Rights Page"
    files:
      - name: "rights"
        label: "Rights Page Content"
        file: "site/content/rights.json"
        fields:
          - { label: "Page header tag", name: "heroKicker", widget: "string" }
          - { label: "Page header headline", name: "heroHeadline", widget: "string" }
          - { label: "Page header text", name: "heroLede", widget: "text" }
          - label: "Ticker banner items"
            name: "ticker"
            widget: "list"
            field: { label: "Item", name: "item", widget: "string" }
          - label: "Rights sections (accordion)"
            name: "accordion"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body text", name: "body", widget: "text" }
              - label: "Bullet points"
                name: "bullets"
                widget: "list"
                field: { label: "Point", name: "point", widget: "string" }
          - { label: "Bottom CTA headline", name: "ctaHeadline", widget: "string" }
          - { label: "Bottom CTA text", name: "ctaText", widget: "text" }
          - label: "Useful links (sidebar buttons)"
            name: "usefulLinks"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Button text", name: "label", widget: "string" }
              - { label: "Link (full URL, e.g. https://...)", name: "url", widget: "string" }

  # ---------- Contact page ----------
  - name: "contact-page"
    label: "Contact Page"
    files:
      - name: "contact"
        label: "Contact Page Content"
        file: "site/content/contact.json"
        fields:
          - { label: "Page header tag", name: "heroKicker", widget: "string" }
          - { label: "Page header headline", name: "heroHeadline", widget: "string" }
          - { label: "Page header text", name: "heroLede", widget: "text" }
          - label: "Head office"
            name: "headOffice"
            widget: "object"
            fields:
              - { label: "Office name", name: "name", widget: "string" }
              - { label: "Address", name: "address", widget: "text" }
              - { label: "Phone 1", name: "phone1", widget: "string" }
              - { label: "Phone 2", name: "phone2", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
          - label: "Regional offices"
            name: "regionalOffices"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Office name", name: "name", widget: "string" }
              - { label: "Details", name: "details", widget: "text" }
          - { label: "Regional reps note", name: "repsNote", widget: "text" }

  # ---------- Homepage copy ----------
  - name: "home"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Content"
        file: "site/content/home.json"
        fields:
          - { label: "Hero kicker text", name: "heroKicker", widget: "string" }
          - { label: "Hero headline (white part)", name: "heroHeadlinePlain", widget: "string" }
          - { label: "Hero headline (red part)", name: "heroHeadlineRed", widget: "string" }
          - { label: "Slogan", name: "slogan", widget: "string" }
          - { label: "Hero subtext", name: "heroSubtext", widget: "text" }
          - { label: "'Take action' card tag", name: "actionTag", widget: "string" }
          - { label: "'Take action' card headline", name: "actionHeadline", widget: "string" }
          - { label: "'Take action' card text", name: "actionText", widget: "text" }
          - label: "'What we fight for' pillars"
            name: "pillars"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "'Why join MHPU' cards"
            name: "whyJoin"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
