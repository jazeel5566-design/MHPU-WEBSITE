<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>MHPU Content Admin</title>
  <style>
    /* Faruma — self-hosted Thaana (Dhivehi) font, so editors can see
       properly-shaped Dhivehi text while typing here, not just once
       published. Applied broadly to text fields in the editor rather
       than targeting specific field names, since Decap's internal CSS
       classes can change between versions and aren't reliable to target
       precisely — English fields rendering in this font too is a
       harmless side effect, not a problem. */
    @font-face {
      font-family: 'Faruma';
      src: url('../assets/fonts/faruma.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    textarea, input[type="text"] {
      font-family: 'Faruma', sans-serif !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS, authenticated via DecapBridge (see decapbridge.com).
       Netlify Identity / Git Gateway are deprecated, so this replaces
       that setup. Nothing else on this page needs to change. -->
  <script src="https://unpkg.com/decap-cms@^3.8.3/dist/decap-cms.js"></script>
  <script>
    // Decap re-renders its editing fields dynamically as a single-page
    // app, and its internal CSS class names aren't something we can
    // reliably target from outside (they can change between versions).
    // Instead of guessing at selectors, this finds fields the honest
    // way — by reading each field's actual label text — and only
    // switches those specific boxes to right-to-left, leaving every
    // other (English) field completely untouched.
    (function () {
      function applyRtlNearLabel(label) {
        var container = label.parentElement;
        var attempts = 0;
        while (container && attempts < 4) {
          var field = container.querySelector('textarea, input[type="text"]');
          if (field) {
            field.setAttribute('dir', 'rtl');
            field.style.textAlign = 'right';
            return;
          }
          container = container.parentElement;
          attempts++;
        }
      }

      function scanForDhivehiFields() {
        document.querySelectorAll('label').forEach(function (label) {
          if (!label.dataset.rtlChecked && /dhivehi/i.test(label.textContent)) {
            label.dataset.rtlChecked = 'true';
            applyRtlNearLabel(label);
          }
        });
      }

      // Both a live observer (for normal use) and a periodic fallback
      // (in case fields render in a way the observer doesn't catch) —
      // belt and suspenders, since this runs inside a third-party app
      // we don't control the internals of.
      var observer = new MutationObserver(scanForDhivehiFields);
      observer.observe(document.body, { childList: true, subtree: true });
      setInterval(scanForDhivehiFields, 1000);
    })();
  </script>
</body>
</html>
